name: Deploy ReaPack Index

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reapack-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install reapack-index
        run: gem install reapack-index

      - name: Generate or update index.xml
        run: reapack-index --name "kb_ReaScripts" --commit

      - name: Push changes
        run: git push
